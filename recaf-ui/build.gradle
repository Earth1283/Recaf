plugins {
    id 'application'
    alias(libs.plugins.javafx)
    alias(libs.plugins.shadow)
}

def javaFxVersion = '23.0.2'
def javaFxIncludeInDist = System.getProperty('skip_jfx_bundle') == null

javafx {
    version = javaFxVersion
    modules = ['javafx.controls', 'javafx.media']

    // By default the JavaFX natives match the OS building the jar. To bundle those of another OS pass:
    //   -Pjfx.platform=mac            (Intel macOS)
    //   -Pjfx.platform=mac-aarch64    (Apple silicon macOS)
    //   -Pjfx.platform=win | linux | linux-aarch64
    if (project.hasProperty('jfx.platform'))
        platform = project.property('jfx.platform')
}

dependencies {
    implementation project(':recaf-core')
    testImplementation(testFixtures(project(":recaf-core")))

    implementation(libs.acc.agent)
    implementation(libs.atlantafx)
    implementation(libs.docking)
    implementation(libs.bundles.ikonli)
    implementation(libs.bundles.image.io)
    implementation(libs.jsvg)
    implementation(libs.reactfx)
    implementation(libs.richtextfx)
    implementation(libs.treemapfx)
    implementation(libs.spatialcanvas)
}

application {
    mainClass = 'software.coley.recaf.Main'
}

jar {
    manifest {
        attributes(
                'Enable-Native-Access': 'ALL-UNNAMED',
                'Main-Class': 'software.coley.recaf.Main'
        )
    }
}

shadowJar {
    // Vineflower reads its version from the package manifest, so retain it when bundling the engine.
    manifest.attributes(['Implementation-Version': libs.versions.vineflower.get()],
            'org/jetbrains/java/decompiler/main/decompiler/')

    exclude "META-INF/maven/**"
    exclude "META-INF/rewrite/**"
    exclude "META-INF/proguard/*"
    exclude "META-INF/plugins/*"
    exclude "META-INF/native-image/*"
    exclude "META-INF/*.properties"
    // Signature files of signed dependencies (Bouncy Castle) are invalid once merged into the fat jar.
    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"
    exclude "META-INF/*.EC"

    // Platform-specific JavaFX packages need only the matching Z3 native libraries.
    def z3Platforms = [
            mac: 'osx/amd64', 'mac-aarch64': 'osx/aarch64', win: 'windows/amd64',
            linux: 'linux/amd64', 'linux-aarch64': 'linux/aarch64'
    ]
    def z3Platform = z3Platforms[project.findProperty('jfx.platform')]
    if (javaFxIncludeInDist && z3Platform != null) {
        (z3Platforms.values() + ['windows/x86']).findAll { it != z3Platform }.each {
            exclude "com/microsoft/z3/${it}/**"
        }
    }

    dependencies {
        exclude(dependency(javaFxIncludeInDist ? 'invalid:invalid:invalid' : 'org.openjfx:.*:.*'))
    }
}

apply from: '../gradle/tasks.gradle'
